name: Terraform CI-CD

on:
  push:
    branches:
      - main
    paths:
      - "7.AWS Security/**"
      - "14.Terraform outputs/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_VAR_my_ip: ${{ secrets.TF_VAR_my_ip }}

jobs:
  # Job 1: Validate the Terraform outputs project
  terraform-outputs-validate:
    name: Validate Terraform Outputs
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 14.Terraform outputs

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate

  # Job 2: Plan the existing AWS Security project
  terraform-plan:
    name: Terraform Format, Validate and Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 7.AWS Security

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: 7.AWS Security/tfplan
          retention-days: 1

  # Job 3: Wait for approval and then apply the saved plan
  terraform-apply:
    name: Approval and Terraform Apply
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: 7.AWS Security

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: 7.AWS Security

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Display Terraform Outputs
        run: |
          echo "=== INFRASTRUCTURE DEPLOYMENT OUTPUTS ==="
          terraform output

      - name: Infrastructure Validation
        run: |
          terraform state list
          aws sts get-caller-identity
